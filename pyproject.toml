[tool.poetry]
name = "tubetalk"
version = "0.1.0"
description = "YouTube Video Intelligence Agent (CLI & Multimodal RAG)"
authors = ["TubeTalk Team"]
readme = "docs/README.md"
packages = [{ include = "tubetalk" }]


[tool.pyright]
venvPath = "."
venv = ".venv"


[tool.poetry.scripts]
tubetalk = "tubetalk.cli.main:app"

[tool.poetry.dependencies]
python = "3.12.*"
typer = "*"
rich = "*"
pydantic = "*"
pydantic-settings = "*"
google-genai = "*"
chromadb = "*"
yt-dlp = "*"
youtube-transcript-api = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-mock = "*"
ruff = "*"
mypy = "*"
poethepoet = "*"
pylint = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
format-check = "ruff format --check ."
format = "ruff format ."
lint = "ruff check ."
test = "pytest --cov=tubetalk --cov-report=term-missing --cov-fail-under=90"
check = ["format-check", "lint", "test"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
files = ["tubetalk"]
