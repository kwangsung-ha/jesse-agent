[tool.poetry]
name = "tubetalk"
version = "0.1.0"
description = "YouTube Video Intelligence Agent (CLI & Multimodal RAG)"
authors = ["TubeTalk Team"]
readme = "docs/README.md"
packages = [{include = "tubetalk"}]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.12.0"
rich = "^13.7.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
google-genai = ">=0.1.0"
chromadb = "^0.5.0"
yt-dlp = "^2024.4.9"
youtube-transcript-api = "^0.6.2"
opencv-python = "^4.9.0.80"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
ruff = "^0.4.0"
mypy = "^1.9.0"
poethepoet = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
format-check = "ruff format --check ."
format = "ruff format ."
lint = "ruff check ."
test = "pytest --cov=tubetalk --cov-report=term-missing --cov-fail-under=90"
check = ["format-check", "lint", "test"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
files = ["tubetalk"]
